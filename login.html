<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <main class="login-container">
        <section class="login-box">
            <div class="login-title">Login</div>

            <label for="emailLogin">E-mail</label>
            <input id="emailLogin" name="email" type="email" autocomplete="username">

            <label for="senhaLogin">Password</label>
            <input id="senhaLogin" name="senha" type="password" autocomplete="current-password">

            <button id="btEntrar" type="button">Entrar</button>

            <div id="mensagemLogin"></div>
        </section>
    </main>

    <script src="login.js"></script>
</body>
</html>
